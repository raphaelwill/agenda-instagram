<!DOCTYPE html><html><head><meta charset="utf-8"><title>relay natal</title></head><body><p id="s">aguardando</p>
<script>
async function enviar(){
  const s=document.getElementById('s');
  const posts=await (await fetch('natal/posts.json',{cache:'no-store'})).json();
  const files={}; const names=[...new Set(posts.map(p=>p.file))];
  for(const n of names){ files[n]=await (await fetch('natal/'+n,{cache:'no-store'})).blob(); s.textContent='baixado '+n; }
  window.opener.postMessage({natal:true,posts,files},'https://agenda.rwsys.com.br');
  s.textContent='enviado '+posts.length+' posts, '+names.length+' imagens';
}
window.addEventListener('load',()=>{ if(window.opener) enviar().catch(e=>document.getElementById('s').textContent='erro '+e); });
</script></body></html>
